<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>විශ්ව මාතාව - දෛනික ප්‍රතිඥා</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap');

  :root{
    --night-deep:#171338;
    --night-mid:#2c1f52;
    --dawn-rose:#f2a08c;
    --dawn-gold:#f0b955;
    --cream:#fdf6ec;
    --ink:#1f1a3a;
    --ink-soft:#5b5478;
    --gold:#d99a3d;
    --gold-soft:#e9c98a;
    --line:rgba(31,26,58,0.12);
    --card:rgba(255,255,255,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Sinhala','Fraunces',serif;
    color:var(--ink);
    min-height:100vh;
    transition:background 1.2s ease;
    background:linear-gradient(180deg,#fdf1e0 0%,#fbe4cf 45%,#f7d3c2 100%);
    padding:24px 16px 60px;
  }
  body.night{
    background:linear-gradient(180deg,var(--night-deep) 0%,var(--night-mid) 55%,#3a2a5c 100%);
    color:var(--cream);
  }

  .wrap{max-width:560px;margin:0 auto;}

  /* Header */
  header{text-align:center;margin-bottom:20px;}
  .eyebrow{
    font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-style:italic;
    font-size:28px;margin:0 0 4px;letter-spacing:0.01em;
  }
  .date-line{font-size:13px;color:var(--ink-soft);}
  body.night .date-line{color:#c9c2e8;}

  /* Sun/Moon arc - signature element */
  .arc-box{
    position:relative;height:120px;margin:22px 0 10px;
  }
  .arc-svg{width:100%;height:100%;display:block;}
  .arc-path{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 6;}
  body.night .arc-path{stroke:rgba(255,255,255,0.18);}
  .arc-marker{transition:all 0.8s cubic-bezier(.4,0,.2,1);}

  /* Mode toggle */
  .toggle{
    display:flex;background:var(--card);border-radius:999px;padding:4px;
    margin:18px 0 22px;border:1px solid var(--line);
  }
  body.night .toggle{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.14);}
  .toggle button{
    flex:1;border:none;background:transparent;padding:10px 14px;
    font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;
    cursor:pointer;color:var(--ink-soft);transition:all 0.3s;
  }
  body.night .toggle button{color:#c9c2e8;}
  .toggle button.active{
    background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(217,154,61,0.4);
  }
  body.night .toggle button.active{background:var(--dawn-gold);color:var(--night-deep);}

  /* Card */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px;backdrop-filter:blur(6px);
  }
  body.night .card{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12);}

  .item{
    display:flex;align-items:flex-start;gap:12px;padding:13px 0;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  body.night .item{border-color:rgba(255,255,255,0.1);}
  .item:last-child{border-bottom:none;}
  .check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;
    border:2px solid var(--gold-soft);margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.25s;
  }
  body.night .check{border-color:rgba(233,201,138,0.5);}
  .item.done .check{background:var(--gold);border-color:var(--gold);}
  body.night .item.done .check{background:var(--dawn-gold);border-color:var(--dawn-gold);}
  .check svg{width:12px;height:12px;opacity:0;transition:opacity 0.2s;}
  .item.done .check svg{opacity:1;}
  .item p{margin:0;font-size:14.5px;line-height:1.6;transition:opacity 0.25s;}
  .item.done p{opacity:0.55;text-decoration:line-through;text-decoration-color:var(--gold-soft);}

  /* Progress + streak */
  .stats{
    display:flex;gap:12px;margin-top:18px;
  }
  .stat{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;text-align:center;
  }
  body.night .stat{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12);}
  .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold);}
  body.night .stat .num{color:var(--dawn-gold);}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  body.night .stat .lbl{color:#c9c2e8;}

  /* Calendar dots */
  .cal-title{font-size:12px;color:var(--ink-soft);margin:22px 0 10px;letter-spacing:0.04em;}
  body.night .cal-title{color:#c9c2e8;}
  .cal{display:flex;gap:5px;flex-wrap:wrap;}
  .dot{
    width:22px;height:22px;border-radius:7px;background:var(--card);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:9px;color:var(--ink-soft);
  }
  body.night .dot{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12);color:#c9c2e8;}
  .dot.full{background:var(--gold);border-color:var(--gold);color:#fff;}
  .dot.half{background:var(--gold-soft);border-color:var(--gold-soft);}
  body.night .dot.full{background:var(--dawn-gold);border-color:var(--dawn-gold);color:var(--night-deep);}
  body.night .dot.half{background:rgba(233,201,138,0.35);border-color:rgba(233,201,138,0.35);}

  .complete-msg{
    text-align:center;font-size:13.5px;color:var(--gold);margin-top:14px;
    font-style:italic;font-family:'Fraunces',serif;opacity:0;transition:opacity 0.4s;height:0;
  }
  body.night .complete-msg{color:var(--dawn-gold);}
  .complete-msg.show{opacity:1;height:auto;margin-bottom:4px;}

  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:13px;}

  /* Vision board */
  .vision-title{font-size:12px;color:var(--ink-soft);margin:26px 0 10px;letter-spacing:0.04em;}
  body.night .vision-title{color:#c9c2e8;}
  .vision-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  .vision-card{
    position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;
    border:1px solid var(--line);background:var(--card);
  }
  body.night .vision-card{border-color:rgba(255,255,255,0.14);}
  .vision-card svg{width:100%;height:100%;display:block;}
  .vision-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .vision-card .cap{
    position:absolute;left:0;right:0;bottom:0;padding:8px 10px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.55));
    color:#fff;font-size:12px;font-weight:600;
  }
  .vision-card.wide{grid-column:1 / -1;}

  /* Calendar */
  .cal-header{
    display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;
  }
  .cal-title{font-size:13px;font-weight:600;color:var(--ink);}
  body.night .cal-title{color:var(--cream);}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;
  }
  body.night .cal-nav button{border-color:rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:var(--cream);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--ink-soft);padding-bottom:4px;}
  body.night .cal-wd{color:#c9c2e8;}
  .cal-day{
    aspect-ratio:1;border-radius:8px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);
  }
  body.night .cal-day{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12);color:#c9c2e8;}
  .cal-day.empty{background:transparent;border-color:transparent;}
  .cal-day.full{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;}
  .cal-day.half{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--ink);}
  body.night .cal-day.full{background:var(--dawn-gold);border-color:var(--dawn-gold);color:var(--night-deep);}
  body.night .cal-day.half{background:rgba(233,201,138,0.35);border-color:rgba(233,201,138,0.35);}
  .cal-day.today{outline:2px solid var(--gold);outline-offset:1px;}
  body.night .cal-day.today{outline-color:var(--dawn-gold);}

  /* Achievements log */
  .ach-input-row{display:flex;gap:8px;margin-top:2px;}
  .ach-input{
    flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    font-family:inherit;font-size:13.5px;background:var(--card);color:var(--ink);
  }
  body.night .ach-input{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.16);color:var(--cream);}
  .ach-input::placeholder{color:var(--ink-soft);}
  body.night .ach-input::placeholder{color:#9d94c2;}
  .ach-add{
    padding:11px 18px;border-radius:12px;border:none;background:var(--gold);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
  body.night .ach-add{background:var(--dawn-gold);color:var(--night-deep);}
  .ach-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .ach-item{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  }
  body.night .ach-item{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12);}
  .ach-star{color:var(--gold);flex-shrink:0;font-size:15px;margin-top:1px;}
  body.night .ach-star{color:var(--dawn-gold);}
  .ach-text{flex:1;font-size:13.5px;line-height:1.5;}
  .ach-date{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  body.night .ach-date{color:#9d94c2;}
  .ach-del{
    background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;
    flex-shrink:0;line-height:1;padding:2px 4px;
  }
  body.night .ach-del{color:#9d94c2;}
  .ach-empty{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:14px 0;}
  body.night .ach-empty{color:#9d94c2;}
</style>
</head>

  <header>
    <div class="eyebrow">විශ්ව මාතාවට කෘතඥතාව</div>

  <div class="stats">

let mode = (new Date().getHours() >= 17 || new Date().getHours() < 5) ? 'night' : 'morning';
let data = {}; // { "YYYY-MM-DD": { morning: [bool...], night: [bool...] } }

function todayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function dayComplete(rec, list, arr){
  if(!rec || !rec[list]) return false;
  return rec[list].filter(Boolean).length === arr.length && arr.length>0;
}

async function load(){
  try{
    const raw = localStorage.getItem('affirmation-data');
    data = raw ? JSON.parse(raw) : {};
  }catch(e){ data = {}; }
  render();
}

async function save(){
  try{ localStorage.setItem('affirmation-data', JSON.stringify(data)); }
  catch(e){ console.error('save failed', e); }
}

function ensureToday(){
  const k = todayKey();
  if(!data[k]) data[k] = { morning: new Array(MORNING.length).fill(false), night: new Array(NIGHT.length).fill(false) };
  return data[k];
}

function setMode(m){
  mode = m;
  document.body.classList.toggle('night', m==='night');
  document.getElementById('btnMorning').classList.toggle('active', m==='morning');
  document.getElementById('btnNight').classList.toggle('active', m==='night');
  document.getElementById('titleText').textContent = m==='morning' ? 'උදෑසන ප්‍රතිඥා' : 'රාත්‍රී ප්‍රතිඥා';
  const marker = document.getElementById('arcMarker');
  if(m==='morning'){ marker.setAttribute('cx','20'); marker.setAttribute('cy','90'); marker.setAttribute('fill','#d99a3d'); }
  else { marker.setAttribute('cx','280'); marker.setAttribute('cy','90'); marker.setAttribute('fill','#e9c98a'); }
  render();
}

function render(){
  const rec = ensureToday();
  const list = mode==='morning' ? MORNING : NIGHT;
  const arr = rec[mode];
  const card = document.getElementById('listCard');
  card.innerHTML = '';
  list.forEach((text,i)=>{
    const done = !!arr[i];
    const item = document.createElement('div');
    item.className = 'item' + (done?' done':'');
    item.innerHTML = `<div class="check">${done?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>':''}</div><p>${text}</p>`;
    item.addEventListener('click', ()=>{
      arr[i] = !arr[i];
      save();
      render();
    });
    card.appendChild(item);
  });

  document.getElementById('dateLine').textContent = new Date().toLocaleDateString('si-LK', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  const complete = dayComplete(rec, mode, list);
  document.getElementById('completeMsg').classList.toggle('show', complete);

  // stats
  const keys = Object.keys(data).sort();
  let streak = 0;
  for(let d=new Date(); ; d.setDate(d.getDate()-1)){
    const k = todayKey(d);
    const r = data[k];
    const mDone = r ? dayComplete(r,'morning',MORNING) : false;
    const nDone = r ? dayComplete(r,'night',NIGHT) : false;
    if(mDone && nDone){ streak++; } else { break; }
  }
  document.getElementById('streakNum').textContent = streak;
  const totalFull = keys.filter(k=>{
    const r = data[k];
    return dayComplete(r,'morning',MORNING) && dayComplete(r,'night',NIGHT);
  }).length;
  document.getElementById('totalNum').textContent = totalFull;

  // calendar (month view, navigable, unbounded)
  renderCalendar();
}

let calView = new Date(); // month currently shown

const SI_MONTHS = ["ජනවාරි","පෙබරවාරි","මාර්තු","අප්‍රේල්","මැයි","ජූනි","ජූලි","අගෝස්තු","සැප්තැම්බර්","ඔක්තෝබර්","නොවැම්බර්","දෙසැම්බර්"];
const SI_WD = ["ඉ","සඳ","අඟ","බදා","බ්‍ර","සිකු","සෙන"];

function renderCalendar(){
  const y = calView.getFullYear(), m = calView.getMonth();
  document.getElementById('calTitle').textContent = SI_MONTHS[m] + ' ' + y;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  SI_WD.forEach(w=>{
    const el = document.createElement('div');
    el.className = 'cal-wd'; el.textContent = w;
    grid.appendChild(el);
  });
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStr = todayKey();
  for(let i=0;i<firstDay;i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,m,d);
    const k = todayKey(dateObj);
    const r = data[k];
    const mDone = r ? dayComplete(r,'morning',MORNING) : false;
    const nDone = r ? dayComplete(r,'night',NIGHT) : false;
    const el = document.createElement('div');
    el.className = 'cal-day' + (mDone&&nDone?' full':(mDone||nDone?' half':'')) + (k===todayStr?' today':'');
    el.textContent = d;
    grid.appendChild(el);
  }
}

document.getElementById('prevMonth').addEventListener('click', ()=>{
  calView.setMonth(calView.getMonth()-1);
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  calView.setMonth(calView.getMonth()+1);
  renderCalendar();
});

// Achievements log
let achievements = [];

async function loadAchievements(){
  try{
    const raw = localStorage.getItem('achievements-log');
    achievements = raw ? JSON.parse(raw) : [];
  }catch(e){ achievements = []; }
  renderAchievements();
}

async function saveAchievements(){
  try{ localStorage.setItem('achievements-log', JSON.stringify(achievements)); }
  catch(e){ console.error('save achievements failed', e); }
}

function renderAchievements(){
  const list = document.getElementById('achList');
  list.innerHTML = '';
  if(achievements.length===0){
    list.innerHTML = '<div class="ach-empty">තවම සාර්ථකත්වයන් එකතු කරලා නෑ — පළමු එක අද ලියන්න ✦</div>';
    return;
  }
  achievements.slice().reverse().forEach((a)=>{
    const idx = achievements.indexOf(a);
    const item = document.createElement('div');
    item.className = 'ach-item';
    const dateDisp = new Date(a.date).toLocaleDateString('si-LK', {year:'numeric', month:'short', day:'numeric'});
    item.innerHTML = `<div class="ach-star">★</div><div style="flex:1"><div class="ach-text"></div><div class="ach-date">${dateDisp}</div></div><button class="ach-del">✕</button>`;
    item.querySelector('.ach-text').textContent = a.text;
    item.querySelector('.ach-del').addEventListener('click', ()=>{
      achievements.splice(idx,1);
      saveAchievements();
      renderAchievements();
    });
    list.appendChild(item);
  });
}

function addAchievement(){
  const input = document.getElementById('achInput');
  const text = input.value.trim();
  if(!text) return;
  achievements.push({ text, date: new Date().toISOString() });
  input.value = '';
  saveAchievements();
  renderAchievements();
}

document.getElementById('achAdd').addEventListener('click', addAchievement);
document.getElementById('achInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') addAchievement();
});

loadAchievements();

document.getElementById('btnMorning').addEventListener('click', ()=>setMode('morning'));
document.getElementById('btnNight').addEventListener('click', ()=>setMode('night'));

setMode(mode);
load();
</script>
